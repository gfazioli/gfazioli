# Renders the profile card and the repository cards with glancecard
# (https://github.com/gfazioli/glancecard) and commits them to glancecard/.
# A project's README embeds its card from this repository's master, so the
# daily bot commit lands here and the project's own history stays clean.
#
# To add a project: one line under the second step's `repos`, then the card
# under its README's title, pointing at
# raw.githubusercontent.com/gfazioli/gfazioli/master/glancecard/<name>.svg.

name: glancecard

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/glancecard.yml"

permissions:
  contents: write

concurrency:
  group: glancecard
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gfazioli/glancecard@8e4c15ade388a37c8c800319c657c1350775730e # v0.5.0
        with:
          profile: gfazioli
          repos: |
            gfazioli/octoscope
            gfazioli/glancecard
          # dark and light for a <picture>; halloween is worn from 1 October
          # to 2 November and is Midnight the rest of the year.
          theme: dark, light, halloween
          time-zone: Europe/Rome
          commit-message: "chore: refresh the glancecard cards"
      # Every other public repository with a README: one file each, <name>.svg,
      # in one seasonal look. Halloween is worn from 1 October to 2 November and
      # is Midnight the rest of the year; switching the season is this line
      # alone, the READMEs point at the file, not at a look.
      - uses: gfazioli/glancecard@8e4c15ade388a37c8c800319c657c1350775730e # v0.5.0
        with:
          repos: |
            gfazioli/amiga-assembly-library
            gfazioli/Amiga-Guru-Meditation
            gfazioli/Boilerplate-Laravel-Facade
            gfazioli/brand
            gfazioli/browser-storage
            gfazioli/Chroma-Key
            gfazioli/commodore-64
            gfazioli/findergit-website
            gfazioli/gfazioli.github.io
            gfazioli/gh-octoscope
            gfazioli/git-towser-test
            gfazioli/homebrew-tap
            gfazioli/lancetta-website
            gfazioli/Laravel-Artisan-Supervisor-Command
            gfazioli/Laravel-Morris-PHP
            gfazioli/mantine-audio
            gfazioli/mantine-book
            gfazioli/mantine-border-animate
            gfazioli/mantine-clock
            gfazioli/mantine-compare
            gfazioli/mantine-depth-select
            gfazioli/mantine-extensions-assets
            gfazioli/mantine-extensions-hub
            gfazioli/mantine-flip
            gfazioli/mantine-json-tree
            gfazioli/mantine-led
            gfazioli/mantine-lens-select
            gfazioli/mantine-list-view-table
            gfazioli/mantine-marquee
            gfazioli/mantine-mask
            gfazioli/mantine-onboarding-tour
            gfazioli/mantine-parallax
            gfazioli/mantine-picker
            gfazioli/mantine-qr-code
