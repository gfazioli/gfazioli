# Renders the profile card and the repository cards with glancecard
# (https://github.com/gfazioli/glancecard) and commits them to glancecard/.
# A project's README embeds its card from this repository's master, so the
# daily bot commit lands here and the project's own history stays clean.
#
# To add a project: one line under `repos`, then a <picture> in its README
# pointing at raw.githubusercontent.com/gfazioli/gfazioli/master/glancecard/.

name: glancecard

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/glancecard.yml"

permissions:
  contents: write

concurrency:
  group: glancecard
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gfazioli/glancecard@9c25b9eed969b7c610e995bfdfb906486a86d390 # v0.3.0
        with:
          profile: gfazioli
          repos: |
            gfazioli/octoscope
            gfazioli/glancecard
          # dark and light for a <picture>; halloween is worn from 1 October
          # to 2 November and is Midnight the rest of the year.
          theme: dark, light, halloween
          time-zone: Europe/Rome
          commit-message: "chore: refresh the glancecard cards"
